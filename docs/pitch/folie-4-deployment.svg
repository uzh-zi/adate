<text x="1340" y="386" font-size="23" fill="#0028A5" font-weight="600" letter-spacing="2">WAS DARAUS FOLGT</text>
<rect x="1340" y="429" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="440" font-size="27" fill="#121212" font-weight="600">Keine öffentliche IP</text>
<text x="1366" y="474" font-size="21" fill="#666666">Die Landing Zone verbietet sie per</text>
<text x="1366" y="502" font-size="21" fill="#666666">Policy — der Weg über das Gateway</text>
<text x="1366" y="530" font-size="21" fill="#666666">ist nicht bevorzugt, sondern der einzige.</text>
<rect x="1340" y="583" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="594" font-size="27" fill="#121212" font-weight="600">Zwei Pull Requests</text>
<text x="1366" y="628" font-size="21" fill="#666666">Subnetze kommen von Subscription</text>
<text x="1366" y="656" font-size="21" fill="#666666">Vending, der Ingress-Eintrag von</text>
<text x="1366" y="684" font-size="21" fill="#666666">Connectivity Management.</text>
<rect x="1340" y="737" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="748" font-size="27" fill="#121212" font-weight="600">X-Forwarded-Host</text>
<text x="1366" y="782" font-size="21" fill="#666666">Ohne den injizierten Header baut Easy</text>
<text x="1366" y="810" font-size="21" fill="#666666">Auth die Redirect-URI auf den internen</text>
<text x="1366" y="838" font-size="21" fill="#666666">FQDN — und der Login scheitert.</text>
<rect x="1340" y="891" width="9" height="9" fill="#0028A5"/>
<text x="1366" y="902" font-size="27" fill="#121212" font-weight="600">Egress über die Firewall</text>
<text x="1366" y="936" font-size="21" fill="#666666">Graph, Login und Registry brauchen</text>
<text x="1366" y="964" font-size="21" fill="#666666">Regeln; sonst kommt die App nicht raus.</text>
<text x="100" y="1058" font-size="21" fill="#666666">Adate / Appkit — Pitch</text>
<text x="1820" y="1058" font-size="21" fill="#666666" text-anchor="end">4 / 6</text>
